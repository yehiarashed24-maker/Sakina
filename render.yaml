services:
  # Backend FastAPI Service
  - type: web
    name: sakina-api
    env: python
    buildCommand: "cd sakina-rag && pip install -r requirements.txt"
    startCommand: "cd sakina-rag && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: sakina-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_URL
        value: "https://sakina-api.onrender.com" # Fallback, Render doesn't natively allow referencing its own URL dynamically via fromService for itself, but actually they do via RENDER_EXTERNAL_URL directly in the env.

  # Frontend Static Site
  - type: web
    name: sakina-ai
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sakina-api
          envVarKey: RENDER_EXTERNAL_URL
