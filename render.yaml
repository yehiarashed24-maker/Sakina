services:
  # Unified Web Service (FastAPI + React)
  - type: web
    name: sakina-ai-unified
    env: python
    plan: free
    buildCommand: "npm install && npm run build && cd sakina-rag && pip install -r requirements.txt"
    startCommand: "cd sakina-rag && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: VITE_API_URL
        value: "" # Empty because API is on the same domain
      # The following must be set in the Render Dashboard securely:
      # - OPENROUTER_API_KEY
      # - MONGODB_URI
